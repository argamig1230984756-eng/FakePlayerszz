name: Build plugins

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0.0

      - name: Build Paper plugin
        working-directory: paper
        run: gradle build --no-daemon

      - name: Build Velocity plugin
        working-directory: velocity
        run: gradle build --no-daemon

      - name: Upload Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: SkyBlockPlus-Paper
          path: paper/build/libs/SkyBlockPlus-Paper.jar

      - name: Upload Velocity jar
        uses: actions/upload-artifact@v4
        with:
          name: SkyBlockPlus-Velocity
          path: velocity/build/libs/SkyBlockPlus-Velocity.jar

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paper/build/libs/SkyBlockPlus-Paper.jar
            velocity/build/libs/SkyBlockPlus-Velocity.jar
